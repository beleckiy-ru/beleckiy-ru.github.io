# Деплой на prestable: сайт https://prestable.beleckiy.ru; имя бакета — переменная S3_PRESTABLE_BUCKET (environment prestable-s3)
name: Deploy prestable
on:
  workflow_dispatch:
jobs:
  deploy:
    environment: prestable-s3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y optipng jpegoptim webp
          npm install -g clean-css-cli html-minifier-terser

      - name: Build service pages from template
        run: node tools/build-services.mjs

      - name: Optimize images
        run: |
          find ./img -type f \( -name "*.jpg" -o -name "*.jpeg" \) -exec jpegoptim --max=85 --strip-all {} \;
          find ./img -type f -name "*.png" -exec optipng -o2 {} \;

      - name: Minify CSS (in-place)
        run: find ./css -name "*.css" -exec cleancss -o {} {} \;

      - name: Minify HTML (in-place)
        run: |
          for f in index.html services/*.html; do
            html-minifier-terser \
              --collapse-whitespace --remove-comments \
              --minify-css true --minify-js true \
              -o "$f" "$f"
          done

      - name: Check directory content
        run: |
          pwd
          ls -la
          ls -la css
          ls -la img
          ls -la services

      - name: Prestable robots.txt (noindex)
        run: cp deploy/prestable/robots.txt robots.txt

      - uses: MrMeison/yc-object-storage-action@main
        with:
          accessKeyId: ${{ secrets.S3_ACCESS_KEY_ID }}
          secretAccessKey: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          bucketName: ${{ vars.S3_BUCKET }}
          clear: true
          include: |
            css/**/*.*
            fonts/**/*.*
            img/**/*.*
            index.html
            services/*.html
            robots.txt
            sitemap.xml
