name: Deploy
on:
  workflow_dispatch:
jobs:
  deploy:
    environment: production-s3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # полная история — нужна для дат lastmod в sitemap

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y optipng jpegoptim webp
          npm install -g clean-css-cli html-minifier-terser

      - name: Build service pages from template
        run: node tools/build-services.mjs

      - name: Generate sitemap (lastmod from git)
        run: node tools/build-sitemap.mjs

      - name: Optimize images
        run: |
          find ./img -type f \( -name "*.jpg" -o -name "*.jpeg" \) -exec jpegoptim --max=85 --strip-all {} \;
          find ./img -type f -name "*.png" -exec optipng -o2 {} \;

      - name: Minify CSS (in-place)
        run: find ./css -name "*.css" -exec cleancss -o {} {} \;

      - name: Minify HTML (in-place)
        run: |
          for f in index.html services/*.html; do
            html-minifier-terser \
              --collapse-whitespace --remove-comments \
              --minify-css true --minify-js true \
              -o "$f" "$f"
          done

      - name: Stage files for upload
        run: |
          mkdir -p _site
          cp -r css fonts img services _site/
          cp index.html robots.txt sitemap.xml _site/

      - name: Check directory content
        run: |
          pwd
          ls -la _site
          ls -la _site/css
          ls -la _site/img
          ls -la _site/services

      - name: Sync to Yandex Object Storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
        run: |
          aws s3 sync _site/ s3://${{ vars.S3_BUCKET }}/ \
            --delete \
            --endpoint-url https://storage.yandexcloud.net
